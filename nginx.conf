server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Interactive fiction: static files only, no SPA fallback
    location /fiction/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed assets are safe to cache for a long time
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must always be revalidated, or deploys look stale
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Everything else is a client-side route
    location / {
        try_files $uri /index.html;
    }
}